<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Winesun的月岛 · Mooncat</title><link rel="stylesheet" href="game.css"><link rel="stylesheet" href="widget.css"><script src="audio.js" defer></script><script src="game.js" defer></script><script src="widget.js" defer></script></head>
<body><div class="widget-shell">
  <main id="widgetGarden"></main>
  <header id="dragHandle" class="widget-header"><button id="widgetPet" class="widget-avatar" aria-label="摸摸Winesun，听猫叫"><img src="assets/mooncat-art.png" alt="围巾小猫Winesun" draggable="false"></button><div class="widget-brand"><strong>Winesun的月岛</strong><span id="widgetMood">花开有自己的时间</span></div></header>
  <div class="widget-wallet"><span>✦</span><strong id="widgetWallet">12</strong><small>星光</small></div>
  <span id="widgetWeather" class="widget-weather">月夜</span>
  <span id="widgetBlessings" class="widget-blessings" title="每累计新赚到 100 星光，将余额的 20% 化成祝福。">♡ 祝福 0 次</span>
  <aside class="window-tools" aria-label="窗口与声音"><button id="expandButton" aria-label="返航，回到全屏星空" title="返航"><svg viewBox="0 0 24 24"><path d="M8 7H4v4m0-4 6 6m-3 3c6 5 15 0 13-7-1-5-7-6-11-4"/></svg><span>返航</span></button><button id="pinButton" aria-label="取消置顶" aria-pressed="true" title="置顶"><svg viewBox="0 0 24 24"><path d="m8 3 8 0-1 6 4 4H5l4-4-1-6ZM12 13v8"/></svg></button><button id="widgetMusic" aria-label="暂停音乐" aria-pressed="false" title="音乐"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 9l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></svg></button><button id="hideButton" aria-label="最小化到任务栏" title="最小化到任务栏"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button></aside>
  <p id="widgetStatus" class="widget-status" role="status" aria-live="polite">Winesun会陪你等花开。</p>
  <div class="widget-actions"><button id="manageButton" class="manage-button" aria-expanded="false"><span>打理花园</span><svg viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button><button id="autocareButton" class="autocare-button" aria-pressed="true" title="切换自动托管"><span class="auto-dot"></span><span id="autocareText">托管中</span></button></div>
  <span id="widgetSave" class="widget-save">自动保存</span>
</div><div id="widgetHearts" aria-hidden="true"></div><div id="widgetToast" role="status" aria-live="polite"></div></body></html>
