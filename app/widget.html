<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>月白的桌边小花园 · Mooncat</title><link rel="stylesheet" href="game.css"><link rel="stylesheet" href="widget.css"><script src="audio.js" defer></script><script src="game.js" defer></script><script src="widget.js" defer></script></head>
<body>
<div class="widget-shell">
<header id="dragHandle" class="widget-header"><button id="widgetPet" class="widget-avatar" aria-label="摸摸月白，听一声猫叫"><img src="assets/mooncat-art.png" alt="奶白色小猫月白" draggable="false"></button><div class="widget-brand"><strong>月白的小花园</strong><span><i></i><span id="widgetMood">今天也慢慢来</span></span></div><div class="window-tools"><button id="pinButton" aria-label="取消置顶" aria-pressed="true" title="置顶">⌖</button><button id="foldButton" aria-label="收成小猫模式" title="缩成小猫">◌</button><button id="hideButton" aria-label="收进系统托盘" title="收进托盘">−</button></div></header>
<main id="widgetGarden"></main>
<div class="widget-info"><span class="wallet"><span>✦</span><strong id="widgetWallet">12</strong><small>星光</small></span><span id="widgetStatus" role="status" aria-live="polite">月白会帮你照料花田。</span></div>
<div class="widget-actions"><button id="autocareButton" class="autocare-button" aria-pressed="true"><span class="auto-dot"></span><span id="autocareText">月白托管中</span></button><button id="manageButton" aria-expanded="false">打理花园</button><button id="widgetMusic" aria-pressed="false" title="播放舒缓音乐" aria-label="播放舒缓音乐">♫</button><button id="expandButton" title="展开观景站" aria-label="展开观景站">↗</button></div>
<div class="widget-bottom"><span id="widgetSave">自动保存 · 慢慢生长</span><span>MOONCAT</span></div>
</div>
<div class="pet-peek"><div class="peek-tools"><button id="peekExpand" aria-label="展开小花园" title="展开小花园">↗</button><button id="peekHide" aria-label="收进系统托盘" title="收进托盘">−</button></div><button id="peekCat" class="peek-cat" aria-label="摸摸月白，听一声猫叫"><img src="assets/mooncat-art.png" alt="坐在月球上的小猫月白" draggable="false"></button><div class="peek-status"><span>✦ <b id="peekWallet">12</b></span><span id="peekAuto">月白托管中</span></div></div>
<div id="widgetHearts" aria-hidden="true"></div><div id="widgetToast" role="status" aria-live="polite"></div>
</body></html>
